<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigos — Regional Conclave 2026 Coordinator Sheet</title>
<style>
  :root{ --red:#d61f2b; --black:#0c0c0e; --gold:#f2c14e; --card:#17181c; --muted:#9aa0a6; --green:#5fd97a; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--black); color:#fff; padding-bottom:90px; }
  header{ text-align:center; padding:22px 16px 14px; border-bottom:3px solid var(--red); }
  header .brand{ font-size:12px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  header h1{ margin:6px 0 2px; font-size:clamp(18px,4vw,26px); }
  header h1 span{ color:var(--red); }
  header .chapter{ display:inline-block; margin-top:6px; background:var(--gold); color:#000; font-weight:800; padding:4px 16px; border-radius:999px; letter-spacing:1px; text-transform:uppercase; font-size:12px; }
  header .leads{ margin-top:6px; color:var(--muted); font-size:12px; }

  .wrap{ max-width:640px; margin:0 auto; padding:18px 14px 40px; }

  .alert{ background:linear-gradient(90deg,#3a0d10,#1a1a1a); border:1px solid var(--red); border-radius:10px; padding:12px 14px; text-align:center; font-size:13px; font-weight:700; margin-bottom:16px; }
  .alert.spot{ border-color:var(--gold); }

  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  .summary .box{ background:var(--card); border:1px solid #2a2b30; border-radius:10px; padding:10px 6px; text-align:center; }
  .summary .box .n{ font-size:20px; font-weight:800; }
  .summary .box .n.paid{ color:var(--green); }
  .summary .box .n.pending{ color:var(--muted); }
  .summary .box .n.amt{ color:var(--gold); }
  .summary .box .l{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-top:2px; }

  .search{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid #33343a; background:#0f1013; color:#fff; font-size:14px; margin-bottom:14px; }

  .member{ background:var(--card); border:1px solid #2a2b30; border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .member .row{ display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; }
  .member .idx{ color:var(--muted); font-size:12px; width:22px; flex-shrink:0; }
  .member .name{ flex:1; font-size:14px; font-weight:600; }
  .member .status{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.5px; flex-shrink:0; border:none; cursor:pointer; }
  .member .status.Pending{ background:#33343a; color:var(--muted); }
  .member .status.Paid{ background:var(--green); color:#052b0c; }
  .member .chev{ color:var(--muted); font-size:12px; transition:transform .2s; flex-shrink:0; }
  .member.open .chev{ transform:rotate(90deg); }
  .member .detail{ display:none; padding:0 14px 14px; border-top:1px solid #26272b; }
  .member.open .detail{ display:block; }
  .stepper-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; font-size:13px; }
  .stepper-row .lbl{ color:var(--muted); }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{ width:26px; height:26px; border-radius:50%; border:1px solid #33343a; background:#0f1013; color:#fff; font-size:15px; cursor:pointer; }
  .stepper button:disabled{ opacity:.35; cursor:default; }
  .stepper .qty{ min-width:16px; text-align:center; font-weight:700; }
  .member .subtotal{ text-align:right; padding-top:8px; border-top:1px solid #26272b; font-size:13px; color:var(--gold); font-weight:700; }

  .empty-state{ text-align:center; color:var(--muted); font-size:13px; padding:30px 10px; background:var(--card); border:1px dashed #33343a; border-radius:12px; }

  .bar{ position:fixed; bottom:0; left:0; right:0; background:#111; border-top:1px solid #2a2b30; padding:12px 16px; display:flex; gap:10px; justify-content:center; }
  .bar button{ flex:1; max-width:220px; padding:13px; border:none; border-radius:999px; font-weight:800; font-size:14px; letter-spacing:.5px; cursor:pointer; }
  .bar .sync{ background:var(--red); color:#fff; }
  .bar .export{ background:transparent; border:1px solid #33343a; color:#fff; }
  .bar button:disabled{ opacity:.6; }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--gold); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .3s; z-index:10; }
  .toast.show{ opacity:1; }

  .back{ display:block; text-align:center; margin-top:16px; color:var(--gold); text-decoration:none; font-size:13px; }
</style>
</head>
<body>

<header>
  <div class="brand">BNI Raipur &amp; Rest of Chhattisgarh</div>
  <h1>Regional <span>Conclave</span> 2026</h1>
  <div class="chapter">Amigos Chapter</div>
  <div class="leads" id="leadsLine">Chapter Coordinator Sheet</div>
</header>

<div class="wrap">
  <div class="alert" id="alertBanner">Loading pricing status…</div>

  <div class="summary">
    <div class="box"><div class="n paid" id="sumPaid">0</div><div class="l">Paid</div></div>
    <div class="box"><div class="n pending" id="sumPending">0</div><div class="l">Pending</div></div>
    <div class="box"><div class="n amt" id="sumAmount">₹0</div><div class="l">Collected</div></div>
  </div>

  <input class="search" id="searchBox" type="text" placeholder="Search member name…">

  <div id="memberList"></div>

  <a class="back" href="dashboard.html">← Back to Live Dashboard</a>
</div>

<div class="bar">
  <button class="sync" id="syncBtn">Save &amp; Sync</button>
  <button class="export" id="exportBtn">Export</button>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="members_amigos.js"></script>
<script>
  const CHAPTER = { name: "Amigos", slug: "amigos" };

  // MEMBERS comes from members_amigos.js — an array of strings (names).
  // Populate that file with the real chapter roster; this page builds the
  // Pending/Paid + family/kids tracking UI on top of it automatically.
  const state = (typeof MEMBERS !== 'undefined' ? MEMBERS : []).map(name => ({
    name, status: 'Pending', kids0_5: 0, kids5plus: 0
  }));

  function activeTier(){
    const now = new Date();
    return CONCLAVE_CONFIG.pricing.find(t => !t.until || now <= new Date(t.until)) || CONCLAVE_CONFIG.pricing[CONCLAVE_CONFIG.pricing.length-1];
  }

  function memberAmount(m){
    const tier = activeTier();
    const base = m.status === 'Paid' ? tier.amount : 0; // only counts toward "collected" once marked Paid
    return base; // kids/family amounts are shown per-row; total collected reflects the member's own registration
  }

  function rowAmount(m){
    const tier = activeTier();
    return tier.amount + (m.kids5plus * tier.amount); // member + paid kids (5+); kids 0-5 stay free
  }

  function renderAlert(){
    const t = activeTier();
    const el = document.getElementById('alertBanner');
    el.className = 'alert' + (t.key === 'spot' ? ' spot' : '');
    if(t.key === 'spot'){
      el.textContent = `📍 SPOT REGISTRATION OPEN — ₹${t.amount}/- per member`;
    } else {
      const until = new Date(t.until);
      const daysLeft = Math.ceil((until - new Date()) / 86400000);
      el.textContent = `⏰ ${t.label.toUpperCase()} RATE (₹${t.amount}/-) CLOSES IN ${daysLeft} DAY${daysLeft===1?'':'S'} — ${until.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}`;
    }
  }

  function renderSummary(){
    const paid = state.filter(m => m.status === 'Paid').length;
    const pending = state.length - paid;
    const total = state.reduce((sum,m) => sum + (m.status==='Paid' ? rowAmount(m) : 0), 0);
    document.getElementById('sumPaid').textContent = paid;
    document.getElementById('sumPending').textContent = pending;
    document.getElementById('sumAmount').textContent = '₹' + total.toLocaleString('en-IN');
  }

  function renderList(filter){
    const list = document.getElementById('memberList');
    list.innerHTML = '';
    if(state.length === 0){
      list.innerHTML = `<div class="empty-state">No member roster loaded yet for ${CHAPTER.name}.<br>Add names to <code>members_${CHAPTER.slug}.js</code> to populate this list.</div>`;
      return;
    }
    const q = (filter||'').toLowerCase();
    state.forEach((m,i) => {
      if(q && m.name.toLowerCase().indexOf(q) === -1) return;
      const tier = activeTier();
      const div = document.createElement('div');
      div.className = 'member';
      div.innerHTML = `
        <div class="row" data-idx="${i}">
          <div class="idx">${i+1}</div>
          <div class="name">${m.name}</div>
          <button class="status ${m.status}" data-action="status" data-idx="${i}">${m.status}</button>
          <div class="chev">▶</div>
        </div>
        <div class="detail">
          <div class="stepper-row">
            <div class="lbl">Kids 0–5 (FREE)</div>
            <div class="stepper">
              <button data-action="dec0" data-idx="${i}" ${m.kids0_5<=0?'disabled':''}>−</button>
              <div class="qty">${m.kids0_5}</div>
              <button data-action="inc0" data-idx="${i}">+</button>
            </div>
          </div>
          <div class="stepper-row">
            <div class="lbl">Kids 5+ (₹${tier.amount} each)</div>
            <div class="stepper">
              <button data-action="dec5" data-idx="${i}" ${m.kids5plus<=0?'disabled':''}>−</button>
              <div class="qty">${m.kids5plus}</div>
              <button data-action="inc5" data-idx="${i}">+</button>
            </div>
          </div>
          <div class="subtotal">Row total: ₹${rowAmount(m).toLocaleString('en-IN')}</div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.getElementById('memberList').addEventListener('click', function(e){
    const btn = e.target.closest('[data-action]');
    const rowEl = e.target.closest('.member');
    if(btn){
      const idx = Number(btn.dataset.idx);
      const action = btn.dataset.action;
      if(action === 'status'){
        state[idx].status = state[idx].status === 'Pending' ? 'Paid' : 'Pending';
      } else if(action === 'inc0'){ state[idx].kids0_5++; }
      else if(action === 'dec0'){ state[idx].kids0_5 = Math.max(0, state[idx].kids0_5-1); }
      else if(action === 'inc5'){ state[idx].kids5plus++; }
      else if(action === 'dec5'){ state[idx].kids5plus = Math.max(0, state[idx].kids5plus-1); }
      renderList(document.getElementById('searchBox').value);
      renderSummary();
      e.stopPropagation();
      return;
    }
    if(rowEl){
      rowEl.classList.toggle('open');
    }
  });

  document.getElementById('searchBox').addEventListener('input', function(){
    renderList(this.value);
  });

  document.getElementById('syncBtn').addEventListener('click', function(){
    const url = CONCLAVE_CONFIG.appsScriptUrl;
    if(!url || url.indexOf('PASTE_APPS_SCRIPT') !== -1){
      toast('Backend not connected yet — see SETUP_INSTRUCTIONS.md');
      return;
    }
    const btn = this;
    btn.disabled = true; btn.textContent = 'Syncing…';
    const tier = activeTier();
    const payload = {
      action: 'sync',
      chapter: CHAPTER.name,
      tier: tier.label,
      timestamp: new Date().toISOString(),
      members: state.map(m => ({
        name: m.name, status: m.status, kids0_5: m.kids0_5, kids5plus: m.kids5plus,
        amount: m.status === 'Paid' ? rowAmount(m) : 0
      }))
    };
    fetch(url, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(){
      toast('✓ Synced to live sheet');
      btn.disabled = false; btn.textContent = 'Save & Sync';
    }).catch(function(){
      toast('Sync failed — try again');
      btn.disabled = false; btn.textContent = 'Save & Sync';
    });
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    const tier = activeTier();
    const rows = [['#','Name','Status','Kids 0-5','Kids 5+','Amount']];
    state.forEach((m,i) => rows.push([i+1, m.name, m.status, m.kids0_5, m.kids5plus, m.status==='Paid' ? rowAmount(m) : 0]));
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${CHAPTER.slug}_regional_conclave_2026.csv`;
    a.click();
  });

  // On load, pull any previously-synced Paid/Pending statuses for this chapter
  // so the coordinator sees where they left off, not a blank sheet.
  function loadSavedState(){
    const url = CONCLAVE_CONFIG.appsScriptUrl;
    if(!url || url.indexOf('PASTE_APPS_SCRIPT') !== -1 || state.length === 0) return;
    const cbName = 'chapterCb_' + Date.now();
    window[cbName] = function(data){
      (data.members || []).forEach(saved => {
        const m = state.find(x => x.name.trim().toLowerCase() === String(saved.name).trim().toLowerCase());
        if(m){
          m.status = saved.status === 'Paid' ? 'Paid' : 'Pending';
          m.kids0_5 = Number(saved.kids0_5) || 0;
          m.kids5plus = Number(saved.kids5plus) || 0;
        }
      });
      renderList(document.getElementById('searchBox').value);
      renderSummary();
      delete window[cbName];
      script.remove();
    };
    const script = document.createElement('script');
    script.src = url + '?action=chapter&chapter=' + encodeURIComponent(CHAPTER.name) + '&callback=' + cbName;
    document.body.appendChild(script);
  }

  renderAlert();
  renderSummary();
  renderList('');
  loadSavedState();
</script>
</body>
</html>
